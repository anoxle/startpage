e.json",note.style.display="block"):(o=PRESETS+e+"/"+e+".json",t=PRESETS+e+"/"+e+"-mobile.json",note.style.display="none"),dlD.dataset.url=o,dlM.dataset.url=t,dlD.onclick=e=>{e.preventDefault(),download(dlD.dataset.url)},dlM.onclick=e=>{e.preventDefault(),download(dlM.dataset.url)},toggle("overlay")}async function download(e){try{const o=await fetch(e);if(!o.ok)throw new Error("Download failed: "+o.status);const t=await o.blob(),l=URL.createObjectURL(t),n=document.createElement("a");n.href=l,n.download=e.split("/").pop(),document.body.appendChild(n),n.click(),n.remove(),setTimeout(()=>URL.revokeObjectURL(l),1e3)}catch(e){console.error(e),alert("Download failed. Check the console for details.")}}function openLightbox(e){lightboxImg.src=e,toggle("lightbox")}</script></body></html>
